v2:
  faq0:
    answer: Des sessions de recherche d'emploi collectives et semi-autonomes, de 2 semaines chacune, durant lesquelles le groupe co-construit sa dynamique de recherche, partage ses expériences, participe à des ateliers proposés par des intervenant·es bénévoles et avance ensemble.
    question: C'est quoi une promo Cojob Nantes ?    
  faq1:
    answer: Cojob Nantes s’adresse à toute personne en recherche d’emploi ou en réflexion professionnelle, prête à s’engager dans une démarche collective d’entraide et de partage, quels que soient son âge et son parcours.  Il n'est pas nécessaire d'être inscrit à France Travail.
    question: Qui peut s'inscrire à une promo ?
  faq2:
    answer: 'Le coût d’inscription est de 40€ dont 10 € d''adhésion à l''association. Ce tarif inclut l’utilisation de notre local avec ses équipements : WiFi, imprimante, kitchenette… ainsi que les consommables (thé, café…).' 
    question: Combien coûte l'inscription à une promo ?
  faq3:
    answer: En cliquant sur « S'inscrire » puis remplir le formulaire. Tu reçois un mail de confirmation de ta demande d’inscription, et une fois qu’il y a assez de participant·es inscrit·s (4 minimum), tu reçois la confirmation d’inscription et le détail le vendredi précédant le début de la promo.
    question: Comment s'inscrire ?
  faq4:
    answer: Afin que ces 2 semaines soient pleinement "collectives et solidaires", il est important que chaque participant·e s'engage à être présent·e chaque journée de 9h à 17h (avec une pause déj' bien sûr ^^) sur les 10 jours de promo. A l'exception bien sûr de RDV urgents (médical...) ou liés à ta recherche d'emploi, mais cela doit rester à la marge.
    question: J'ai des contraintes, dois-je être présent·e tous les jours ?
  faq5:
    answer: Oui c’est possible. L’important est de nous prévenir le plus vite possible afin de libérer ta place pour les personnes qui souhaitent rejoindre une promo Cojob. Selon ton choix, tu peux être remboursé·e de 40€, ou bien de 30€ et rester adhérent·e de l’association.
    question: Puis-je être remboursé·e si je ne peux finalement pas participer à la promo ?

