        subtitle: Toute l’année, Cojob Nantes organise des événements à Nantes ouverts à tous·tes pour développer ton réseau professionnel, échanger avec d’autres chercheur·ses d’emploi, bénévoles ou partenaires, dans un cadre convivial.
        aperotaf_goal: L’occasion de faire des rencontres et de rester acteur de ta recherche d’emploi ! 
